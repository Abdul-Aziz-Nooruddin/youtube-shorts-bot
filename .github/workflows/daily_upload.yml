name: Daily YouTube Short

on:
  schedule:
    - cron: '30 4 * * *'  # 4:30 AM UTC = 10:00 AM IST every day
  workflow_dispatch:        # Manual run button in GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Give the workflow permission to push back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore YouTube credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' | base64 --decode > token.pickle

      - name: Create working folders
        run: mkdir -p output/audio output/images assets

      - name: Run bot
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py --now

      - name: Save used topics back to repo
        run: |
          git config user.name  "MindBurst Bot"
          git config user.email "bot@mindburst.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "update used topics [skip ci]"
          git push
